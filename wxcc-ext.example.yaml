# webexccconfig-mcp config. Copy to ./wxcc-ext.yaml or ~/.wxcc-ext/config.yaml,
# or point to it with --config <path> / WXCC_EXT_CONFIG.
# The Webex token is never stored here: set WEBEX_TOKEN in the environment.

# Region code; the API host is derived as https://api.wxcc-<region>.cisco.com
region: us1

# Valid region codes. Add new ones here if Cisco opens a region before this list is updated.
# regions: [us1, eu1, eu2, anz1, ca1, jp1, sg1]

# Optional: overrides the derived host. Must be the bare host, without /v1.
# base_url: https://api.wxcc-us1.cisco.com

# Optional: Webex API host for people, licenses and roles (same for every region). Bare host, without /v1.
# webex_base_url: https://webexapis.com

# Webex Contact Center organization id (or set WEBEX_ORG_ID).
org_id: 00000000-0000-0000-0000-000000000000

# read-only (default) or read-write. Write tools are only registered in read-write mode.
mode: read-only

# Toolsets to enable (default: all).
# toolsets: [routing, agent, telephony, media, data, schedule, org, digital, ai, flow, people]

# Resources this server never exposes. Leaving this out applies the default list in the comment
# below: the admin configuration the official WxCC MCP server writes, as of November 2026.
# [] defers nothing. Add `flow` to leave flows entirely to Cisco's official server.
# defer_to_official: [entry-point, business-hours, dial-plan, dial-number]
defer_to_official: []

# Operation log and snapshots.
# log_dir: ~/.wxcc-ext/logs
# snapshot_dir: ~/.wxcc-ext/snapshots

# Where relative saveTo (exports) and bodyFile (imports) paths resolve.
# export_dir: ~/.wxcc-ext/exports

# request_timeout_ms: 30000   # flow deletes always get at least 90000

# Parallel requests when wxcc-ext-bulk deletes records one by one (operation: delete), 1 to 10.
# bulk_concurrency: 4

# Tool responses above this size are trimmed with a hint to use page/pageSize/attributes.
# max_response_chars: 50000

# Audio uploads: provided files and `say` output are converted with ffmpeg.
# audio:
#   voice: Samantha
#   ffmpeg_path: ffmpeg
#   tts_command: say
#   tts_args: ["-o", "{out}", "-f", "{in}"]   # {in} = text file, {out} = audio file to write
#   voice_args: ["-v", "{voice}"]
#   sample_rate: 8000
#   channels: 1
#   codec: pcm_s16le
